name: Cv-search ci
on:
  push:
    branches:
    - main

  pull_request:
    branches:
      - main 

jobs:
  
  secret-scanning:
      name: Gitleaks scan 
      runs-on: ubuntu-latest
      steps:
        - name: Code Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
          with:
            fetch-depth: 0 #fetch all commits, not only the last

        - name: Scan for secrets
          run : |
            docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --verbose --source /repo

  build:
    needs: secret-scanning
    name: Compilation Maven & tests
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install & setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
        

      - name: Compilation
        working-directory: cv-search
        run: mvn compile 

      - name: Tests
        working-directory: cv-search
        run: mvn test


      
        
             
